<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Neural Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(99, 102, 241, 0.2)" />
    </pattern>

    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="glow-effect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing & flowing background elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(0.9) translate(-40px, 25px); opacity: 0.65; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes memoryFlow {
      0% { transform: translateX(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateX(350px); opacity: 0; }
    }

    .bg-orb-1 {
      transform-origin: 250px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .bg-orb-2 {
      transform-origin: 950px 240px;
      animation: pulseOrb2 10s ease-in-out infinite;
    }
    .memory-wire {
      stroke-dasharray: 8, 8;
      animation: dashMove 15s linear infinite;
    }
    .floating-card-1 {
      animation: floatNode 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatNode 7s ease-in-out infinite 1s;
    }
    .signal-dot {
      animation: memoryFlow 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .signal-dot-delay {
      animation: memoryFlow 4s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Background Lights -->
  <g filter="url(#blur-bg)">
    <circle class="bg-orb-1" cx="220" cy="110" r="140" fill="#6366f1" />
    <circle class="bg-orb-2" cx="980" cy="220" r="160" fill="#ec4899" />
    <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.25" />
  </g>

  <!-- Dynamic Circuit / Memory Synapse Network Lines (Placed in background) -->
  <g opacity="0.35">
    <path class="memory-wire" d="M 50 80 Q 250 20 450 90 T 850 70 T 1150 120" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="memory-wire" d="M 50 300 Q 300 340 600 280 T 1150 260" fill="none" stroke="#c084fc" stroke-width="1.5" style="animation-duration: 20s;" />
    <path class="memory-wire" d="M 150 350 L 350 180 L 700 230 L 1050 100" fill="none" stroke="#38bdf8" stroke-width="1" style="animation-duration: 12s;" />
  </g>

  <!-- Animated Neural Memory Data Packets -->
  <g fill="#38bdf8" filter="url(#glow-effect)">
    <circle class="signal-dot" cx="150" cy="80" r="3" />
    <circle class="signal-dot-delay" cx="250" cy="285" r="3" />
  </g>

  <!-- Sub-decorative Floating Memory Context Badges (Positioned cleanly away from center text) -->
  <g class="floating-card-1" opacity="0.75" transform="translate(60, 40)">
    <rect width="170" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧠 Long-Term Memory</text>
  </g>

  <g class="floating-card-2" opacity="0.75" transform="translate(970, 50)">
    <rect width="170" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" />
    <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Stateful Agents</text>
  </g>

  <g class="floating-card-1" opacity="0.75" transform="translate(990, 275)">
    <rect width="150" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#06b6d4" />
    <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔄 Multi-Agent Sync</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Highest z-order & Clarity) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.6))">
      Awesome AI Agent Memory &amp; Frameworks
    </text>

    <!-- Gradient Accent Subheading -->
    <text x="600" y="210" text-anchor="middle" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
      Long-Term Memory • Stateful Persistence • Context Management • Multi-Agent Orchestration
    </text>

    <!-- Descriptive Subtext -->
    <text x="600" y="252" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      The definitive index of production-ready SaaS platforms and battle-tested open-source repositories.
    </text>

    <!-- Bottom Feature Highlights -->
    <g transform="translate(600, 298)">
      <text text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        <tspan fill="#38bdf8">◆</tspan> Mem0 &amp; Letta  <tspan fill="#64748b" dx="8">|</tspan>  <tspan fill="#818cf8" dx="8">◆</tspan> LangGraph &amp; CrewAI  <tspan fill="#64748b" dx="8">|</tspan>  <tspan fill="#f472b6" dx="8">◆</tspan> Zep &amp; AutoGen  <tspan fill="#64748b" dx="8">|</tspan>  <tspan fill="#34d399" dx="8">◆</tspan> Dify &amp; Flowise
      </text>
    </g>
  </g>
</svg>

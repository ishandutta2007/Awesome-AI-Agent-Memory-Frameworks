<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".7"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(99, 102, 241, 0.2)"/></pattern><filter id="blur-bg" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="60"/></filter><filter id="glow-effect" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(30px,-20px);opacity:.6}}@keyframes pulseOrb2{0%{transform:scale(1.1) translate(0,0);opacity:.4}50%{transform:scale(.9) translate(-40px,25px);opacity:.65}}@keyframes dashMove{0%{stroke-dashoffset:200}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes memoryFlow{0%{transform:translateX(0);opacity:0}50%{opacity:.8}}.bg-orb-1{transform-origin:220px 110px;animation:pulseOrb 8s ease-in-out infinite}.bg-orb-2{transform-origin:980px 220px;animation:pulseOrb2 10s ease-in-out infinite}.memory-wire{stroke-dasharray:8,8;animation:dashMove 15s linear infinite}.floating-card-1{animation:floatNode 6s ease-in-out infinite}.floating-card-2{animation:floatNode 7s ease-in-out infinite 1s}.signal-dot{animation:memoryFlow 4s cubic-bezier(.4,0,.2,1) infinite}.signal-dot-delay{animation:memoryFlow 4s cubic-bezier(.4,0,.2,1) infinite 2s}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g filter="url(#blur-bg)"><circle cx="220" cy="110" r="140" fill="#6366f1" class="bg-orb-1"/><circle cx="980" cy="220" r="160" fill="#ec4899" class="bg-orb-2"/><circle cx="600" cy="300" r="120" fill="#06b6d4" opacity=".25"/></g><g opacity=".35"><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 50 80 Q 250 20 450 90 T 850 70 T 1150 120" class="memory-wire"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 50 300 Q 300 340 600 280 T 1150 260" class="memory-wire" style="animation-duration:20s"/><path fill="none" stroke="#38bdf8" stroke-width="1" d="M 150 350 L 350 180 L 700 230 L 1050 100" class="memory-wire" style="animation-duration:12s"/></g><g fill="#38bdf8" filter="url(#glow-effect)"><circle cx="150" cy="80" r="3" class="signal-dot"/><circle cx="250" cy="285" r="3" class="signal-dot-delay"/></g><g class="floating-card-1" opacity=".85" transform="translate(60, 40)"><rect width="170" height="34" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="5" fill="#10b981"/><text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Long-Term Memory</text></g><g class="floating-card-2" opacity=".85" transform="translate(970, 50)"><rect width="170" height="34" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="5" fill="#f59e0b"/><text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Stateful Agents</text></g><g class="floating-card-1" opacity=".85" transform="translate(990, 275)"><rect width="150" height="34" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="5" fill="#06b6d4"/><text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Multi-Agent Sync</text></g><g id="foreground-content"><g transform="translate(600, 72)"><rect width="280" height="28" x="-140" y="-14" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" rx="14"/><text y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text></g><text x="600" y="160" fill="#fff" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.6))" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome AI Agent Memory &amp; Frameworks</text><text x="600" y="210" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing=".5" text-anchor="middle">Long-Term Memory • Stateful Persistence • Context Management • Multi-Agent Orchestration</text><text x="600" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" text-anchor="middle">The definitive index of production-ready SaaS platforms and battle-tested open-source repositories.</text><g><text fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle" transform="translate(600, 298)"><tspan fill="#38bdf8">◆</tspan> Mem0 &amp; Letta <tspan fill="#64748b" dx="8">|</tspan> <tspan fill="#818cf8" dx="8">◆</tspan> LangGraph &amp; CrewAI <tspan fill="#64748b" dx="8">|</tspan> <tspan fill="#f472b6" dx="8">◆</tspan> Zep &amp; AutoGen <tspan fill="#64748b" dx="8">|</tspan> <tspan fill="#34d399" dx="8">◆</tspan> Dify &amp; Flowise</text></g></g></svg>